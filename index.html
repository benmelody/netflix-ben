<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BenFlix - Web Xem Phim Của Ben</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; background: #141414; color: #fff; }
    
    nav { position: fixed; top: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent); z-index: 100; }
    .logo { color: #e50914; font-size: 24px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; }
    .search-box input { padding: 8px 15px; border-radius: 4px; border: 1px solid #333; background: rgba(0,0,0,0.75); color: #fff; outline: none; width: 220px; transition: width 0.3s; }
    .search-box input:focus { width: 280px; border-color: #fff; }

    .banner { height: 70vh; position: relative; background-size: cover; background-position: center; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 40px 60px; background-color: #222; }
    .banner::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 150px; background: linear-gradient(to top, #141414, transparent); }
    .banner-content { position: relative; z-index: 2; max-width: 600px; }
    .banner-title { font-size: 36px; font-weight: 700; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
    .banner-desc { font-size: 14px; color: #ddd; margin-bottom: 20px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .banner-btn { padding: 10px 25px; background: #e50914; border: none; border-radius: 4px; font-weight: 600; font-size: 16px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; transition: background 0.2s; }
    .banner-btn:hover { background: #b20710; }

    .row { padding: 20px 40px; }
    .row-title { font-size: 20px; font-weight: 600; margin-bottom: 12px; color: #e50914; }
    .movie-row { display: flex; gap: 15px; overflow-x: auto; scrollbar-width: none; padding-bottom: 10px; min-height: 260px; }
    .movie-row::-webkit-scrollbar { display: none; }
    
    .movie-card { min-width: 160px; height: 240px; border-radius: 6px; overflow: hidden; cursor: pointer; transition: transform 0.3s; position: relative; flex-shrink: 0; background: #222; text-decoration: none; display: block; }
    .movie-card:hover { transform: scale(1.08); z-index: 10; box-shadow: 0 10px 20px rgba(0,0,0,0.8); }
    .movie-card img { width: 100%; height: 100%; object-fit: cover; }
    .movie-card .movie-name { position: absolute; bottom: 0; width: 100%; padding: 10px; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); font-size: 12px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
  </style>
</head>
<body>

  <nav>
    <div class="logo"><i class="fa-solid fa-play"></i> BenFlix</div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Tìm kiếm phim..." onkeypress="handleSearch(event)">
    </div>
  </nav>

  <!-- Banner chính -->
  <div class="banner" id="banner" style="background-image: url('https://image.tmdb.org/t/p/original/or06FN3Dka5tukK1e9sl16pB3iy.jpg');">
    <div class="banner-content">
      <h1 class="banner-title" id="bannerTitle">Đang tải...</h1>
      <p class="banner-desc" id="bannerDesc">Khám phá các bộ phim bom tấn mới nhất.</p>
      <a href="#" id="bannerBtn" target="_blank" class="banner-btn"><i class="fa-solid fa-play"></i> Xem ngay</a>
    </div>
  </div>

  <div class="row">
    <div class="row-title">🔥 Phim Thịnh Hành & Chiếu Rạp</div>
    <div class="movie-row" id="trendingRow"></div>
  </div>

  <div class="row">
    <div class="row-title">🎬 Phim Lẻ Hay Nhất</div>
    <div class="movie-row" id="movieRow"></div>
  </div>

  <div class="row">
    <div class="row-title">📺 Phim Bộ & Hoạt Hình</div>
    <div class="movie-row" id="tvRow"></div>
  </div>

  <script>
    const API_KEY = "3fd2be6f0c70a2a598f084ddfb75487c"; 
    const BASE_URL = "https://api.themoviedb.org/3";
    const IMG_URL = "https://image.tmdb.org/t/p/w500";
    const ORIG_IMG_URL = "https://image.tmdb.org/t/p/original";

    async function fetchMovies() {
      try {
        // 1. Lấy phim thịnh hành
        const trendingRes = await fetch(`${BASE_URL}/trending/all/day?api_key=${API_KEY}&language=vi-VN`);
        const trendingData = await trendingRes.json();
        const movies = trendingData.results;

        if (movies.length > 0) {
          const topMovie = movies[0];
          const mediaType = topMovie.media_type || 'movie';
          document.getElementById('banner').style.backgroundImage = `url(${ORIG_IMG_URL + topMovie.backdrop_path})`;
          document.getElementById('bannerTitle').innerText = topMovie.title || topMovie.name;
          document.getElementById('bannerDesc').innerText = topMovie.overview || "Thưởng thức bộ phim hấp dẫn này.";
          document.getElementById('bannerBtn').href = `https://vidsrc.cc/v2/embed/${mediaType}/${topMovie.id}`;
        }

        renderRow('trendingRow', movies);

        // 2. Phim lẻ phổ biến
        const movieRes = await fetch(`${BASE_URL}/movie/popular?api_key=${API_KEY}&language=vi-VN`);
        const movieData = await movieRes.json();
        renderRow('movieRow', movieData.results, 'movie');

        // 3. Phim bộ phổ biến
        const tvRes = await fetch(`${BASE_URL}/tv/popular?api_key=${API_KEY}&language=vi-VN`);
        const tvData = await tvRes.json();
        renderRow('tvRow', tvData.results, 'tv');

      } catch (err) {
        console.log("Lỗi tải API:", err);
      }
    }

    function renderRow(elementId, items, defaultType = 'movie') {
      const rowEl = document.getElementById(elementId);
      rowEl.innerHTML = "";
      items.forEach(item => {
        if (!item.poster_path) return;
        const title = item.title || item.name;
        const mediaType = item.media_type || defaultType;

        const card = document.createElement('a');
        card.classList.add('movie-card');
        // Khi click vào sẽ mở thẳng link phát phim chuẩn của TMDB ID qua vidsrc
        card.href = `https://vidsrc.cc/v2/embed/${mediaType}/${item.id}`;
        card.target = "_blank";
        card.innerHTML = `
          <img src="${IMG_URL + item.poster_path}" alt="${title}">
          <div class="movie-name">${title}</div>
        `;
        rowEl.appendChild(card);
      });
    }

    async function handleSearch(e) {
      if (e.key === 'Enter') {
        const query = e.target.value.trim();
        if (!query) return;
        const res = await fetch(`${BASE_URL}/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(query)}&language=vi-VN`);
        const data = await res.json();
        renderRow('trendingRow', data.results, 'movie');
        document.querySelector('.row-title').innerText = `🔍 Kết quả tìm kiếm cho: "${query}"`;
      }
    }

    fetchMovies();
  </script>
</body>
</html>
