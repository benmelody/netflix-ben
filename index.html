<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BenFlix - Xem Phim Trọn Bộ</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; background: #141414; color: #fff; }
    
    nav { position: fixed; top: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent); z-index: 100; }
    .logo { color: #e50914; font-size: 24px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; }
    .search-box input { padding: 8px 15px; border-radius: 4px; border: 1px solid #333; background: rgba(0,0,0,0.75); color: #fff; outline: none; width: 220px; transition: width 0.3s; }
    .search-box input:focus { width: 280px; border-color: #fff; }

    .banner { height: 70vh; position: relative; background-size: cover; background-position: center; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 40px 60px; background-color: #222; }
    .banner::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 150px; background: linear-gradient(to top, #141414, transparent); }
    .banner-content { position: relative; z-index: 2; max-width: 600px; }
    .banner-title { font-size: 36px; font-weight: 700; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
    .banner-desc { font-size: 14px; color: #ddd; margin-bottom: 20px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .banner-btn { padding: 10px 25px; background: #e50914; border: none; border-radius: 4px; font-weight: 600; font-size: 16px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: background 0.2s; }
    .banner-btn:hover { background: #b20710; }

    .row { padding: 20px 40px; }
    .row-title { font-size: 20px; font-weight: 600; margin-bottom: 12px; color: #e50914; }
    .movie-row { display: flex; gap: 15px; overflow-x: auto; scrollbar-width: none; padding-bottom: 10px; min-height: 260px; }
    .movie-row::-webkit-scrollbar { display: none; }
    .movie-card { min-width: 160px; height: 240px; border-radius: 6px; overflow: hidden; cursor: pointer; transition: transform 0.3s; position: relative; flex-shrink: 0; background: #222; }
    .movie-card:hover { transform: scale(1.08); z-index: 10; box-shadow: 0 10px 20px rgba(0,0,0,0.8); }
    .movie-card img { width: 100%; height: 100%; object-fit: cover; }
    .movie-card .movie-name { position: absolute; bottom: 0; width: 100%; padding: 10px; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); font-size: 12px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Modal phát phim */
    #player-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); justify-content: center; align-items: center; z-index: 1000; flex-direction: column; }
    .player-container { width: 90%; max-width: 1000px; display: flex; flex-direction: column; gap: 15px; }
    .video-wrapper { width: 100%; aspect-ratio: 16/9; background: #000; position: relative; border-radius: 8px; overflow: hidden; box-shadow: 0 0 30px rgba(229, 9, 20, 0.4); }
    .video-wrapper iframe { width: 100%; height: 100%; border: none; }
    
    .modal-footer { display: flex; justify-content: space-between; align-items: center; }
    .movie-playing-title { font-size: 18px; font-weight: 600; color: #5eead4; }
    .close-modal { padding: 8px 20px; background: #e50914; border: none; border-radius: 4px; color: #fff; cursor: pointer; font-weight: 600; }
  </style>
</head>
<body>

  <nav>
    <div class="logo"><i class="fa-solid fa-play"></i> BenFlix</div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Tìm kiếm phim (ID TMDB)..." onkeypress="handleSearch(event)">
    </div>
  </nav>

  <div class="banner" id="banner">
    <div class="banner-content">
      <h1 class="banner-title" id="bannerTitle">Avengers: Endgame</h1>
      <p class="banner-desc" id="bannerDesc">Trận chiến cuối cùng của các siêu anh hùng Marvel chống lại Thanos.</p>
      <button class="banner-btn" onclick="playFullMovie('299534', 'movie', 'Avengers: Endgame')"><i class="fa-solid fa-play"></i> Xem ngay</button>
    </div>
  </div>

  <div class="row">
    <div class="row-title">🔥 Phim Bom Tấn & Chiếu Rạp</div>
    <div class="movie-row" id="movieRow">
      <!-- Phim mẫu dự phòng đảm bảo luôn hiện ảnh -->
      <div class="movie-card" onclick="playFullMovie('299534', 'movie', 'Avengers: Endgame')">
        <img src="https://image.tmdb.org/t/p/w500/or06FN3Dka5tukK1e9sl16pB3iy.jpg" alt="Avengers">
        <div class="movie-name">Avengers: Endgame</div>
      </div>
      <div class="movie-card" onclick="playFullMovie('603', 'movie', 'The Matrix')">
        <img src="https://image.tmdb.org/t/p/w500/f89U3ADr1oiB1s9GkdPOEpXUk5H.jpg" alt="Matrix">
        <div class="movie-name">The Matrix</div>
      </div>
      <div class="movie-card" onclick="playFullMovie('157336', 'movie', 'Interstellar')">
        <img src="https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg" alt="Interstellar">
        <div class="movie-name">Interstellar</div>
      </div>
      <div class="movie-card" onclick="playFullMovie('1396', 'tv', 'Breaking Bad')">
        <img src="https://image.tmdb.org/t/p/w500/ztkUQFLlC19CCMYHW9o1zWhJRNq.jpg" alt="Breaking Bad">
        <div class="movie-name">Breaking Bad</div>
      </div>
    </div>
  </div>

  <div id="player-modal">
    <div class="player-container">
      <div class="video-wrapper">
        <iframe id="movieFrame" src="" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
      </div>
      <div class="modal-footer">
        <div class="movie-playing-title" id="playingTitle">Đang phát phim...</div>
        <button class="close-modal" onclick="closeModal()">Đóng phát phim</button>
      </div>
    </div>
  </div>

  <script>
    // Dùng nguồn embed trực tiếp qua TMDB ID (chuẩn và không bị lỗi tải danh sách)
    function playFullMovie(id, mediaType, title) {
      let embedUrl = "";
      if (mediaType === 'tv') {
        embedUrl = `https://vidsrc.cc/v2/embed/tv/${id}/1/1`;
      } else {
        embedUrl = `https://vidsrc.cc/v2/embed/movie/${id}`;
      }

      document.getElementById('playingTitle').innerText = `Đang phát: ${title}`;
      openModal(embedUrl);
    }

    function openModal(url) {
      document.getElementById('movieFrame').src = url;
      document.getElementById('player-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('movieFrame').src = "";
      document.getElementById('player-modal').style.display = 'none';
    }

    function handleSearch(e) {
      if (e.key === 'Enter') {
        const query = e.target.value.trim();
        if (!query) return;
        // Nếu người dùng gõ trực tiếp ID của TMDB vào ô tìm kiếm để xem phim bất kỳ
        if (!isNaN(query)) {
          playFullMovie(query, 'movie', `Phim ID: ${query}`);
        } else {
          alert("Bạn có thể nhập ID TMDB của phim vào đây để xem trực tiếp (Ví dụ: 550 cho Fight Club)");
        }
      }
    }
  </script>
</body>
</html>
