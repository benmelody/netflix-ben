<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BenFlix - Web Xem Phim Của Ben</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; background: #141414; color: #fff; }
    
    nav { position: fixed; top: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent); z-index: 100; }
    .logo { color: #e50914; font-size: 24px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; }
    .search-box input { padding: 8px 15px; border-radius: 4px; border: 1px solid #333; background: rgba(0,0,0,0.75); color: #fff; outline: none; width: 220px; transition: width 0.3s; }
    .search-box input:focus { width: 280px; border-color: #fff; }

    .banner { height: 70vh; position: relative; background-size: cover; background-position: center; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 40px 60px; background-color: #222; }
    .banner::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 150px; background: linear-gradient(to top, #141414, transparent); }
    .banner-content { position: relative; z-index: 2; max-width: 600px; }
    .banner-title { font-size: 36px; font-weight: 700; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
    .banner-desc { font-size: 14px; color: #ddd; margin-bottom: 20px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .banner-btn { padding: 10px 25px; background: #e50914; border: none; border-radius: 4px; font-weight: 600; font-size: 16px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; transition: background 0.2s; }
    .banner-btn:hover { background: #b20710; }

    .row { padding: 20px 40px; }
    .row-title { font-size: 20px; font-weight: 600; margin-bottom: 12px; color: #e50914; }
    .movie-row { display: flex; gap: 15px; overflow-x: auto; scrollbar-width: none; padding-bottom: 10px; min-height: 260px; }
    .movie-row::-webkit-scrollbar { display: none; }
    
    .movie-card { min-width: 160px; height: 240px; border-radius: 6px; overflow: hidden; cursor: pointer; transition: transform 0.3s; position: relative; flex-shrink: 0; background: #222; }
    .movie-card:hover { transform: scale(1.08); z-index: 10; box-shadow: 0 10px 20px rgba(0,0,0,0.8); }
    .movie-card img { width: 100%; height: 100%; object-fit: cover; }
    .movie-card .movie-name { position: absolute; bottom: 0; width: 100%; padding: 10px; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); font-size: 12px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Modal phát video nhúng hoặc xem phim */
    #player-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); justify-content: center; align-items: center; z-index: 1000; flex-direction: column; }
    .player-container { width: 90%; max-width: 900px; display: flex; flex-direction: column; gap: 15px; }
    .video-wrapper { width: 100%; aspect-ratio: 16/9; background: #000; position: relative; border-radius: 8px; overflow: hidden; box-shadow: 0 0 30px rgba(229, 9, 20, 0.4); }
    .video-wrapper iframe { width: 100%; height: 100%; border: none; }
    
    .modal-footer { display: flex; justify-content: space-between; align-items: center; }
    .movie-playing-title { font-size: 18px; font-weight: 600; color: #5eead4; }
    .close-modal { padding: 8px 20px; background: #e50914; border: none; border-radius: 4px; color: #fff; cursor: pointer; font-weight: 600; }
  </style>
</head>
<body>

  <nav>
    <div class="logo"><i class="fa-solid fa-play"></i> BenFlix</div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Tìm kiếm phim..." onkeypress="handleSearch(event)">
    </div>
  </nav>

  <!-- Banner chính -->
  <div class="banner" id="banner">
    <div class="banner-content">
      <h1 class="banner-title" id="bannerTitle">Đang tải phim từ API...</h1>
      <p class="banner-desc" id="bannerDesc">Vui lòng đợi trong giây lát.</p>
      <a href="#" id="bannerBtn" class="banner-btn" style="display:none;"><i class="fa-solid fa-play"></i> Xem ngay</a>
    </div>
  </div>

  <div class="row">
    <div class="row-title">🔥 Phim Hot Trong Ngày (Từ API của Ben)</div>
    <div class="movie-row" id="movieRow">
      <!-- Dữ liệu phim sẽ được chèn tự động vào đây -->
    </div>
  </div>

  <!-- Modal phát phim -->
  <div id="player-modal">
    <div class="player-container">
      <div class="video-wrapper">
        <iframe id="movieFrame" src="" allowfullscreen allow="autoplay"></iframe>
      </div>
      <div class="modal-footer">
        <div class="movie-playing-title" id="playingTitle">Đang phát phim...</div>
        <button class="close-modal" onclick="closeModal()">Đóng phát phim</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://topxx.vip/api/v1/movies/today";

    async function loadMovies() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();
        
        // In ra F12 (Console) để ông dễ kiểm tra cấu trúc JSON trả về của API
        console.log("Dữ liệu API trả về:", data);

        // Giả lập cấu trúc dữ liệu trả về thường là mảng phim (data hoặc data.results hoặc data.items)
        const movies = Array.isArray(data) ? data : (data.results || data.items || data.data || []);

        if (movies.length > 0) {
          // Lấy phim đầu tiên làm Banner
          const topMovie = movies[0];
          const title = topMovie.title || topMovie.name || "Phim Hot";
          const poster = topMovie.poster || topMovie.poster_url || topMovie.thumbnail || "";
          const description = topMovie.description || topMovie.overview || "Thưởng thức bộ phim hấp dẫn này ngay hôm nay.";
          const watchUrl = topMovie.link || topMovie.url || topMovie.embed_url || "#";

          document.getElementById('banner').style.backgroundImage = `url('${poster}')`;
          document.getElementById('bannerTitleinnerText' || 'bannerTitle').innerText = title;
          document.getElementById('bannerDesc').innerText = description;
          
          const bannerBtn = document.getElementById('bannerBtn');
          bannerBtn.style.display = "inline-flex";
          bannerBtn.onclick = (e) => {
            e.preventDefault();
            playMovie(watchUrl, title);
          };

          // Render danh sách phim vào hàng
          const movieRow = document.getElementById('movieRow');
          movieRow.innerHTML = "";

          movies.forEach(movie => {
            const mTitle = movie.title || movie.name || "Phim";
            const mPoster = movie.poster || movie.poster_url || movie.thumbnail || "https://via.placeholder.com/160x240?text=No+Image";
            const mLink = movie.link || movie.url || movie.embed_url || "#";

            const card = document.createElement('div');
            card.classList.add('movie-card');
            card.innerHTML = `
              <img src="${mPoster}" alt="${mTitle}">
              <div class="movie-name">${mTitle}</div>
            `;
            card.onclick = () => playMovie(mLink, mTitle);
            movieRow.appendChild(card);
          });
        }
      } catch (error) {
        console.error("Lỗi gọi API:", error);
        document.getElementById('bannerTitle').innerText = "Không thể tải dữ liệu từ API!";
        document.getElementById('bannerDesc').innerText = "Kiểm tra lại kết nối hoặc định dạng API CORS.";
      }
    }

    function playMovie(url, title) {
      document.getElementById('playingTitle').innerText = `Đang phát: ${title}`;
      const iframe = document.getElementById('movieFrame');
      
      // Nếu link là dạng web xem phim hoặc link embed
      iframe.src = url;
      document.getElementById('player-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('movieFrame').src = "";
      document.getElementById('player-modal').style.display = 'none';
    }

    function handleSearch(e) {
      if (e.key === 'Enter') {
        const query = e.target.value.trim();
        if (query) {
          alert(`Đang tìm kiếm: ${query}`);
        }
      }
    }

    // Chạy hàm load phim khi mở trang
    loadMovies();
  </script>
</body>
</html>
