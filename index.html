<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BenFlix - Web Xem Phim</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; background: #141414; color: #fff; }
    
    nav { position: fixed; top: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent); z-index: 100; }
    .logo { color: #e50914; font-size: 24px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; }
    .search-box input { padding: 8px 15px; border-radius: 4px; border: 1px solid #333; background: rgba(0,0,0,0.75); color: #fff; outline: none; width: 220px; transition: width 0.3s; }
    .search-box input:focus { width: 280px; border-color: #fff; }

    .banner { height: 70vh; position: relative; background-size: cover; background-position: center; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 40px 60px; }
    .banner::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 150px; background: linear-gradient(to top, #141414, transparent); }
    .banner-content { position: relative; z-index: 2; max-width: 600px; }
    .banner-title { font-size: 36px; font-weight: 700; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
    .banner-desc { font-size: 14px; color: #ddd; margin-bottom: 20px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .banner-btn { padding: 10px 25px; background: #e50914; border: none; border-radius: 4px; font-weight: 600; font-size: 16px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: background 0.2s; }
    .banner-btn:hover { background: #b20710; }

    .row { padding: 20px 40px; }
    .row-title { font-size: 20px; font-weight: 600; margin-bottom: 12px; color: #e50914; }
    .movie-row { display: flex; gap: 15px; overflow-x: auto; scrollbar-width: none; padding-bottom: 10px; }
    .movie-row::-webkit-scrollbar { display: none; }
    .movie-card { min-width: 160px; height: 240px; border-radius: 6px; overflow: hidden; cursor: pointer; transition: transform 0.3s; position: relative; flex-shrink: 0; background: #222; }
    .movie-card:hover { transform: scale(1.08); z-index: 10; box-shadow: 0 10px 20px rgba(0,0,0,0.8); }
    .movie-card img { width: 100%; height: 100%; object-fit: cover; }
    .movie-card .movie-name { position: absolute; bottom: 0; width: 100%; padding: 10px; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); font-size: 12px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    #player-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 1000; flex-direction: column; }
    .video-wrapper { width: 85%; max-width: 900px; aspect-ratio: 16/9; background: #000; position: relative; border-radius: 8px; overflow: hidden; box-shadow: 0 0 30px rgba(229, 9, 20, 0.4); }
    .video-wrapper iframe { width: 100%; height: 100%; border: none; }
    .close-modal { margin-top: 15px; padding: 10px 25px; background: #e50914; border: none; border-radius: 4px; color: #fff; cursor: pointer; font-weight: 600; }
    .loading { text-align: center; padding: 40px; color: #888; font-size: 16px; }
  </style>
</head>
<body>

  <nav>
    <div class="logo"><i class="fa-solid fa-play"></i> BenFlix</div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Tìm kiếm phim..." onkeypress="handleSearch(event)">
    </div>
  </nav>

  <div class="banner" id="banner">
    <div class="banner-content">
      <h1 class="banner-title" id="bannerTitle">Đang tải phim từ API...</h1>
      <p class="banner-desc" id="bannerDesc">Vui lòng chờ trong giây lát...</p>
      <button class="banner-btn" onclick="playFeatured()"><i class="fa-solid fa-play"></i> Xem ngay</button>
    </div>
  </div>

  <div class="row">
    <div class="row-title">🔥 Phim Cập Nhật Hôm Nay</div>
    <div class="movie-row" id="movieRow">
      <div class="loading">Đang tải danh sách phim...</div>
    </div>
  </div>

  <div id="player-modal">
    <div class="video-wrapper">
      <iframe id="movieFrame" src="" allowfullscreen></iframe>
    </div>
    <button class="close-modal" onclick="closeModal()">Đóng phát</button>
  </div>

  <script>
    let currentMovies = [];
    let featuredMovie = null;

    async function loadMoviesFromAPI() {
      try {
        // Gọi thẳng vào API do ông vừa tạo trên Vercel
        const res = await fetch('/api/movies?per_page=30');
        const data = await res.json();
        
        // Tùy theo cấu trúc JSON trả về của topxx.vip (thường nằm trong data.items hoặc data.data)
        const movies = data.items || data.data || data.result || data;

        if (Array.isArray(movies) && movies.length > 0) {
          currentMovies = movies;
          featuredMovie = movies[0];

          // Đặt banner
          document.getElementById('banner').style.backgroundImage = `url(${featuredMovie.poster_url || featuredMovie.thumb_url || ''})`;
          document.getElementById('bannerTitle').innerText = featuredMovie.name || featuredMovie.title;
          document.getElementById('bannerDesc').innerText = featuredMovie.origin_name || "Khám phá ngay bộ phim tuyệt vời này.";

          // Render danh sách
          renderRow('movieRow', movies);
        } else {
          document.getElementById('movieRow').innerHTML = `<div class="loading">API trả về dữ liệu trống!</div>`;
        }
      } catch (err) {
        console.error("Lỗi gọi API:", err);
        document.getElementById('movieRow').innerHTML = `<div class="loading">Không thể kết nối vào API!</div>`;
      }
    }

    function renderRow(elementId, items) {
      const row = document.getElementById(elementId);
      row.innerHTML = "";
      items.forEach(item => {
        const title = item.name || item.title;
        const poster = item.poster_url || item.thumb_url || '';
        const card = document.createElement('div');
        card.classList.add('movie-card');
        card.innerHTML = `
          <img src="${poster}" alt="${title}">
          <div class="movie-name">${title}</div>
        `;
        // Khi bấm vào phim sẽ lấy link tập đầu tiên hoặc link trailer của phim đó
        card.onclick = () => playMovie(item);
        row.appendChild(card);
      });
    }

    function playMovie(item) {
      // Giả sử API trả về link embed hoặc link m3u8/trailer
      const watchUrl = item.episode_current || item.trailer_url || "https://www.youtube.com/embed/YE7VzlLtp-4";
      openModal(watchUrl);
    }

    function playFeatured() {
      if (featuredMovie) playMovie(featuredMovie);
    }

    function openModal(url) {
      document.getElementById('movieFrame').src = url;
      document.getElementById('player-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('movieFrame').src = "";
      document.getElementById('player-modal').style.display = 'none';
    }

    function handleSearch(e) {
      if (e.key === 'Enter') {
        const keyword = e.target.value.toLowerCase().trim();
        const filtered = currentMovies.filter(m => (m.name || m.title).toLowerCase().includes(keyword));
        renderRow('movieRow', filtered);
      }
    }

    loadMoviesFromAPI();
  </script>
</body>
</html>
